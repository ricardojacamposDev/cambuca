[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cambuca"
version = "0.4.1"
description = "Assistente de programação local com GGUF e llama.cpp"
requires-python = ">=3.10"
dependencies = ["python-docx==1.2.0"]

[project.scripts]
cambuca = "launcher:main"

[tool.setuptools]
py-modules = ["campos", "launcher", "filetools", "wordtools", "rag"]
